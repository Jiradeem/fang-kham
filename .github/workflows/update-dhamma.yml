name: Update Dhamma clips

on:
  schedule:
    - cron: '17 3 * * 2'   # once a week: Tuesday 03:17 UTC (10:17 Thai time), after the Sat, Sun and Mon discussions
  workflow_dispatch: {}      # also runnable by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-dhamma
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install --quiet --upgrade yt-dlp
      - name: Find new clips and fetch captions
        run: python -I tools/update_dhamma.py --limit 400 --minutes 300
      - name: Publish changes
        run: |
          git config user.name "fang-kham bot"
          git config user.email "actions@users.noreply.github.com"
          git add dhamma.js dhamma-shards.js dhamma-corpus-*.js tools/dhamma-skip.json
          git add -u
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Dhamma clips and captions"
          git push
