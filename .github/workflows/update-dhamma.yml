name: Update Dhamma clips

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # also runnable by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-dhamma
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install --quiet --upgrade yt-dlp
      - name: Find new clips and fetch captions
        run: python -I tools/update_dhamma.py --limit 40 --minutes 50
      - name: Publish changes
        run: |
          git config user.name "fang-kham bot"
          git config user.email "actions@users.noreply.github.com"
          git add dhamma.js dhamma-shards.js dhamma-corpus-*.js
          git add -u
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Dhamma clips and captions"
          git push
