name: Add general clips

on:
  schedule:
    - cron: '23 3 * * 3'   # once a week: Wednesday 03:23 UTC (10:23 Thai time), the day after the Dhamma update
  workflow_dispatch: {}      # also runnable by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-corpus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install --quiet --upgrade yt-dlp yt-dlp-ejs
      - name: Find new clips that suit a classroom and fetch captions
        run: python -I tools/update_corpus.py --limit 80 --minutes 240 --per-channel 3 --max 30000
      - name: Recount sentences per lesson
        run: node tools/count_lessons.js
      - name: Publish changes
        run: |
          git config user.name "fang-kham bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js data-*.js counts.js tools/corpus-skip.json
          git add -u
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add new general clips"
          git pull --rebase
          git push
